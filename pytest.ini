[pytest]
# Тесты бизнес-логики v2.2: без браузера, без Telegram, без сети.
# Запуск в контейнере:  docker compose run --rm bridge pytest
# Локально (нужны aiogram+playwright+pytest):  python3 -m pytest tests -q
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# auto: корутины-тесты работают без маркировки @pytest.mark.asyncio
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers --tb=short
markers =
    slow: тесты, заметно дольше остальных (не пропускать по умолчанию)
