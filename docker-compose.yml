# ============================================================================
#  MAX ⇄ Telegram bridge v2 (Multi-Account) — Orange Pi 5 Plus (RK3588, 32GB)
# ============================================================================
#  Запуск:
#     docker compose up -d --build
#     docker compose logs -f bridge
#  Управление — ПОЛНОСТЬЮ из Telegram-бота (/admin). Первичная авторизация —
#  кнопкой «Добавить аккаунт MAX»; консольный fallback:
#     docker compose run --rm bridge python -m app.auth --create "Школа 5Б" \
#         --chat "9 Б" --owner 123456789
# ============================================================================

services:
  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: max-tg-bridge:2
    platform: linux/arm64
    container_name: max-tg-bridge

    env_file:
      - .env
    environment:
      PROFILES_ROOT: /data/profiles
      TRASH_ROOT: /data/profiles/.trash
      TMP_DIR: /data/tmp
      DB_PATH: /data/state/bridge.db
      BROWSER_LOG: /data/logs/browser.log
      SCREENSHOTS_DIR: /data/logs
      TZ: Europe/Moscow

    # ===== Специфика N×Chromium в docker на ARM64 ==========================
    #shm — общая память процессов Chromium. Дефолтных 64 МБ не хватает уже
    # на одну вкладку SPA; на 2–5 изолированных браузера нужно с запасом:
    # ~0.5-1 ГБ пиковой шаред-памяти на браузер + headroom. 32 ГБ RAM платы
    # это абсолютно безопасно (лимит контейнера ниже — 8 ГБ).
    shm_size: '4gb'
    ipc: private

    networks:
      - bridge-net

    volumes:
      # ИЗОЛИРОВАННЫЕ профили аккаунтов: account_1/, account_2/, …, .trash/
      - ./data/profiles:/data/profiles
      - ./data/state:/data/state
      - ./data/tmp:/data/tmp
      - ./data/logs:/data/logs

    restart: unless-stopped
    stop_grace_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "8m"
        max-file: "3"

    deploy:
      resources:
        limits:
          # 5 аккаунтов: ~600-700 МБ Chromium + python-мост. 8 ГБ — комфортный
          # потолок на 32-гигабайтной плате; OOM-killer системы не заденет.
          memory: 8G
          cpus: "4"

    # Для MAX_HEADLESS=false / ручной капчи через VNC — раскомментируй:
    # entrypoint: ["/usr/local/bin/xvfb-start.sh"]
    # environment:
    #   DISPLAY: ":99"
    #   VNC_ENABLE: "1"
    #   VNC_PASSWORD: "сменить-пароль"
    # ports:
    #   - "127.0.0.1:5900:5900"

networks:
  bridge-net:
    driver: bridge
    name: max-tg-bridge-net
